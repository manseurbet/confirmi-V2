<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmi – التوصيل</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;}
.container{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.box{max-width:420px;width:100%;background:#0b1220;border-radius:16px;padding:30px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.4);box-sizing:border-box;}
.btn-home{background:#334155;color:white;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:14px;margin-bottom:22px;display:block;}
h2{color:#38bdf8;margin:0 0 6px;}
.sub{color:#94a3b8;font-size:14px;margin:0 0 30px;line-height:1.7;}
.link-btn{width:100%;padding:20px 14px;background:#1e3a5f;color:#38bdf8;border:1px solid #38bdf8;border-radius:12px;font-size:19px;font-weight:bold;cursor:pointer;font-family:inherit;}
.link-btn:hover{opacity:.9;}
.soon{display:none;margin-top:22px;padding:16px;background:#122135;border-radius:12px;color:#cbd5e1;font-size:14px;line-height:1.9;}
.soon b{color:#fde68a;}
</style>
</head>
<body>
<div class="container">
  <div class="box">
    <button class="btn-home" type="button" onclick="location.href='index.html'">🏠 العودة للرئيسية</button>

    <h2>🚚 التوصيل</h2>
    <p class="sub">اربط متجرك بشركة التوصيل</p>

    <button class="link-btn" id="linkBtn" type="button">🔗 ربط شركة التوصيل</button>

    <div class="soon" id="soon">
      <b>قريباً 🚀</b><br>
      ربط مباشر مع شركات التوصيل: تُحدَّث حالة كل طلب (تم التسليم / مرتجع) تلقائياً،
      دون أن تسجّلها بنفسك، ويتحسن تقييم زبائنك مباشرة.
    </div>
  </div>
</div>
<script src="auth.js"></script>
<script>
  document.getElementById('linkBtn').addEventListener('click', function () {
    document.getElementById('soon').style.display = 'block';
  });
</script>
</body>
</html>
