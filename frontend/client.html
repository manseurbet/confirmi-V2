<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmi – تأكيد الطلب</title>

<style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;}
.container{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.box{max-width:500px;width:100%;background:#0b1220;border-radius:16px;padding:32px 26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.4);}
.form-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.form-row label{flex:0 0 35%;text-align:left;font-weight:bold;}
.form-row input,.form-row select{flex:1;padding:10px;border-radius:6px;border:none;background:#122135;color:#fff;}
.form-row input[readonly]{background:#0b1220;}
#productImage{width:100%;border-radius:12px;margin-bottom:15px;}
button{width:100%;padding:12px;background:#22c55e;color:#022c22;border:none;border-radius:10px;font-size:16px;font-weight:bold;}
#vendorScoreBox{margin-bottom:15px;font-size:14px;}
#attachmentRow{display:none;}
#shopLine{margin-top:6px;color:#94a3b8;}
#ratingBox{display:none;margin-top:10px;padding:18px;background:#122135;border-radius:12px;}
#ratingBox h3{margin:0 0 6px;font-size:17px;}
#ratingBox p{margin:0 0 12px;font-size:13px;color:#94a3b8;}
#stars{display:flex;justify-content:center;gap:6px;margin-bottom:12px;direction:ltr;}
.star{width:auto;padding:0 4px;background:none;color:#475569;font-size:38px;line-height:1;border:none;cursor:pointer;}
.star.on{color:#fbbf24;}
#ratingComment{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:none;background:#0b1220;color:#fff;font-family:inherit;font-size:14px;resize:none;margin-bottom:12px;}
#ratingError{color:#fca5a5;font-size:13px;min-height:16px;margin-bottom:8px;}
.info-msg{display:none;margin-top:20px;padding:15px;border-radius:10px;font-size:15px;background:#0c4a6e;}
</style>
</head>

<body>
<div class="container">
<div class="box">

<img src="logo.png" style="width:180px;margin-bottom:15px">

<div id="vendorScoreBox">
⭐ تقييم البائع: <b id="vendorScore">—</b>
<div id="shopLine">🏪 <span id="shopName"></span></div>
</div>

<img id="productImage">

<div id="ratingBox">
  <h3>⭐ كيف كانت تجربتك؟</h3>
  <p>تقييمك يساعد الزبائن الآخرين ويحفّز البائع على الأفضل.</p>
  <div id="stars">
    <button type="button" class="star" data-v="1" aria-label="نجمة واحدة">★</button>
    <button type="button" class="star" data-v="2" aria-label="نجمتان">★</button>
    <button type="button" class="star" data-v="3" aria-label="3 نجوم">★</button>
    <button type="button" class="star" data-v="4" aria-label="4 نجوم">★</button>
    <button type="button" class="star" data-v="5" aria-label="5 نجوم">★</button>
  </div>
  <textarea id="ratingComment" rows="3" maxlength="200" placeholder="تعليق اختياري (يراه البائع فقط)"></textarea>
  <div id="ratingError" role="alert"></div>
  <button type="button" id="ratingSubmit">إرسال التقييم</button>
</div>

<div id="infoMessage" class="info-msg"></div>

<form id="clientForm" enctype="multipart/form-data">

<div class="form-row">
<label>👤 الاسم</label>
<input id="clientName" readonly>
</div>

<div class="form-row">
<label>📞 الهاتف</label>
<input id="clientPhone" readonly>
</div>

<div class="form-row">
<label>🔖 المنتج</label>
<input id="productRef" readonly>
</div>

<div class="form-row">
<label>💰 السعر</label>
<input id="amount" readonly>
</div>

<div class="form-row">
<label>📝 الوصف</label>
<input id="description" readonly>
</div>

<div class="form-row">
<label>💳 الدفع</label>
<select id="paymentMethod">
<option value="especes">عند الاستلام</option>
<option value="virement">تحويل</option>
</select>
</div>

<div class="form-row" id="attachmentRow">
<label>📎 إثبات</label>
<input type="file" id="attachment">
</div>

<div style="display: flex; gap: 10px;">
  <button type="submit" style="background: #22c55e;">✅ تأكيد الطلب</button>
  <button type="button" id="refuseBtn" style="background: #ef4444;">❌ رفض الطلب</button>
</div>
</form>

<div id="successMessage" style="display: none; margin-top: 20px; padding: 15px; background: #166534; border-radius: 10px; font-size: 16px;">
  <p style="margin: 0; font-weight: bold;">✅ تم التأكيد بنجاح!</p>
  <p style="margin: 5px 0 0; opacity: 0.9; font-size: 14px;">شكراً على تأكيدك. يمكن للبائع الآن متابعة الطلب.</p>
</div>

<div id="refusedMessage" style="display: none; margin-top: 20px; padding: 15px; background: #7c2d12; border-radius: 10px; font-size: 16px;">
  <p style="margin: 0; font-weight: bold;">❌ تم رفض الطلب</p>
  <p style="margin: 5px 0 0; opacity: 0.9; font-size: 14px;">تم إبلاغ البائع برفضك للطلب.</p>
</div>

</div>
</div>

<script>
function getId(){
  return new URLSearchParams(location.search).get("id");
}

async function loadTransaction(){
  const id = getId();
  if(!id) return alert("رقم المعاملة مفقود");

  try{
    const res = await fetch("/transaction/"+id);
    const data = await res.json();
    if(!data.success) return alert("المعاملة غير موجودة");

    const t = data.transaction;

    clientName.value = t.clientName;
    clientPhone.value = t.clientPhone;
    productRef.value = t.productRef;
    amount.value = t.amount;
    description.value = t.description || "";
    productImage.src = t.photo || "";

    // Note du vendeur : visible à partir de 3 avis, sinon « بائع جديد »
    if(t.vendorRating && t.vendorRating.shown){
      vendorScore.innerText = `${t.vendorRating.average} / 5 (${t.vendorRating.count} تقييم)`;
    } else {
      vendorScore.innerText = "بائع جديد";
    }
    if(t.shopName){
      shopName.innerText = t.shopName;
    } else {
      shopLine.style.display = "none";
    }

    showState(t);

  }catch(e){
    alert("خطأ أثناء تحميل المعاملة");
    console.error(e);
  }
}

loadTransaction();

/* états de la commande quand le client rouvre le lien */
function showInfo(text){
  const box = document.getElementById("infoMessage");
  box.innerText = text;
  box.style.display = "block";
}

function showState(t){
  if(t.refused){
    clientForm.style.display = "none";
    document.getElementById("refusedMessage").style.display = "block";
  } else if(t.delivered){
    clientForm.style.display = "none";
    if(t.rated){
      showInfo("شكراً، تم تسجيل تقييمك ✅");
    } else {
      document.getElementById("ratingBox").style.display = "block";
    }
  } else if(t.confirmed){
    clientForm.style.display = "none";
    document.getElementById("successMessage").style.display = "block";
  }
}

/* notation du vendeur */
let chosenStars = 0;
document.getElementById("stars").addEventListener("click", e=>{
  const b = e.target.closest(".star");
  if(!b) return;
  chosenStars = Number(b.dataset.v);
  document.querySelectorAll(".star").forEach(s=>{
    s.classList.toggle("on", Number(s.dataset.v) <= chosenStars);
  });
  document.getElementById("ratingError").innerText = "";
});

document.getElementById("ratingSubmit").onclick = async ()=>{
  const err = document.getElementById("ratingError");
  if(!chosenStars){ err.innerText = "اختر عدد النجوم أولاً."; return; }
  const btn = document.getElementById("ratingSubmit");
  btn.disabled = true;
  try{
    const r = await fetch("/rate-transaction/"+getId(), {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ stars: chosenStars, comment: document.getElementById("ratingComment").value })
    });
    const d = await r.json();
    if(d.success){
      document.getElementById("ratingBox").style.display = "none";
      showInfo("شكراً لك! تم إرسال تقييمك 🌷");
    } else {
      err.innerText = d.message || "حدث خطأ";
      btn.disabled = false;
    }
  }catch(e){
    err.innerText = "تعذر الاتصال بالخادم";
    btn.disabled = false;
  }
};

/* paiement */
paymentMethod.onchange = ()=>{
  attachmentRow.style.display =
    paymentMethod.value==="virement" ? "flex" : "none";
};

/* confirmation */
clientForm.onsubmit = async e=>{
  e.preventDefault();
  const id = getId();

  const fd = new FormData();
  fd.append("paymentMethod", paymentMethod.value);
  if(attachment.files[0]) fd.append("attachment", attachment.files[0]);

  const r = await fetch("/confirm-transaction/"+id,{method:"POST",body:fd});
  const d = await r.json();
  if(d.success) {
    clientForm.style.display = "none";
    document.getElementById("successMessage").style.display = "block";
  } else {
    alert(d.message || "حدث خطأ");
  }
};

/* refusal */
document.getElementById("refuseBtn").onclick = async ()=>{
  if(!confirm("هل أنت متأكد من رفضك للطلب؟")) return;
  
  const id = getId();
  const r = await fetch("/refuse-transaction/"+id, {method:"POST"});
  const d = await r.json();
  if(d.success) {
    clientForm.style.display = "none";
    document.getElementById("refusedMessage").style.display = "block";
  } else {
    alert(d.message || "حدث خطأ");
  }
};
</script>

</body>
</html>
