<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmi – صفحة البائع</title>
<style>
body{margin:0;font-family:Arial, sans-serif;background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;text-align:right;}
.container{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.box{max-width:500px;width:100%;background:#0b1220;border-radius:16px;padding:32px 26px;box-shadow:0 20px 60px rgba(0,0,0,0.4);}
h1{font-size:28px;margin-bottom:12px;text-align:center;}
h1 span{color:#22c55e;}
.score-card{background:#1e293b;padding:15px;border-radius:12px;margin-bottom:20px;text-align:center;border:1px solid #334155;}
.score-label{font-size:14px;color:#94a3b8;margin-bottom:5px;}
.score-value{font-size:24px;font-weight:bold;color:#22c55e;}
form{display:flex;flex-direction:column;gap:15px;}
label{font-weight:bold;font-size:14px;}
input, textarea{width:100%;padding:12px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:14px;box-sizing:border-box;}
button{width:100%;padding:14px;background:#22c55e;color:#022c22;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;transition:0.3s;}
button:hover{opacity:0.9;}
.btn-home{background:#334155;color:white;margin-bottom:20px;}
#resultSection{display:none;margin-top:25px;padding:20px;background:#122135;border-radius:12px;border:1px dashed #22c55e;text-align:center;}
.btn-whatsapp{background:#25d366;color:#fff;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-sms{background:#0ea5e9;color:#fff;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;}
.paste-box{background:#122135;border:1px dashed #38bdf8;border-radius:12px;padding:14px;margin-bottom:18px;}
.paste-box label{display:block;margin-bottom:8px;color:#7dd3fc;}
.btn-fill{background:#1e3a5f;color:#38bdf8;border:1px solid #38bdf8;margin-top:10px;padding:11px;font-size:14px;}
.fill-result{font-size:13px;margin-top:10px;line-height:1.8;}
.fill-ok{color:#86efac;} .fill-miss{color:#fcd34d;}
.btn-contact{background:#7c3aed;color:#fff;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;}
</style>
</head>
<body>
<div class="container">
  <div class="box">
    <button class="btn-home" onclick="location.href='index.html'">🏠 العودة للرئيسية</button>
    <button class="btn-home" onclick="location.href='import.html'" style="background:#1e3a5f;color:#38bdf8;border:1px solid #38bdf8;margin-bottom:10px;">📋 إرسال جماعي (Google Sheets)</button>
    <h1>Confirmi <span>✓</span></h1>
    <div class="score-card">
      <div class="score-label">⭐ تقييم موثوقية الزبون:</div>
      <div id="scoreDisplay"><span class="score-value" id="scoreNum">--</span> <span id="badgeText"></span></div>
      <div id="scoreCounts" style="font-size:13px;color:#94a3b8;margin-top:6px;"></div>
      <div id="scoreHint" style="font-size:12px;color:#64748b;margin-top:4px;"></div>
    </div>
    <div class="paste-box">
      <label for="pasteText">📋 الصق رسالة الزبون (من Facebook أو Messenger أو WhatsApp)</label>
      <textarea id="pasteText" rows="3" placeholder="انسخ رسالة الزبون والصقها هنا: يتم التعرف على الهاتف والسعر والاسم تلقائياً"></textarea>
      <button type="button" id="fillBtn" class="btn-fill">⚡ تعبئة تلقائية</button>
      <div id="fillResult" class="fill-result" role="status"></div>
    </div>

    <form id="orderForm">
      <input type="hidden" id="sellerId">
      <label>رقم هاتف الزبون</label>
      <input type="tel" id="clientPhone" placeholder="0XXXXXXXXX" required>
      <div id="phoneError" role="alert" style="color:#f87171;font-size:13px;"></div>
      <label>اسم الزبون</label>
      <input type="text" id="clientName" required>
      <label>رمز المنتج / اسم المنتج</label>
      <input type="text" id="productRef" required>
      <label>السعر (دج)</label>
      <input type="number" id="amount" required>
      <label>الوصف</label>
      <textarea id="description" rows="2"></textarea>
      <label>صورة المنتج</label>
      <input type="file" id="productPhoto" accept="image/*">
      <button type="submit">إنشاء رابط التأكيد</button>
    </form>

    <div id="resultSection">
      <p style="color:#22c55e;font-weight:bold;font-size:18px;">✅ تم إنشاء الطلب بنجاح!</p>
      <div style="text-align:right;margin-bottom:16px;">
        <label for="msgLang" style="font-size:12px;color:#94a3b8;display:block;margin-bottom:4px;">لغة الرسالة</label>
        <select id="msgLang" style="width:100%;padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:14px;margin-bottom:10px;">
          <option value="darija">دارجة جزائرية</option>
          <option value="arabic">عربية مبسطة</option>
        </select>
        <label for="msgPreview" style="font-size:12px;color:#94a3b8;display:block;margin-bottom:4px;">الرسالة (يمكنك تعديلها قبل الإرسال)</label>
        <textarea id="msgPreview" rows="8" style="width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:13px;font-family:inherit;line-height:1.7;resize:vertical;"></textarea>
      </div>
      <p style="color:#94a3b8;font-size:14px;margin-top:0;">اختر طريقة إرسال الرابط للزبون:</p>
      <button class="btn-contact" onclick="addContact()">
        <span style="font-size:20px;">👤</span> Ajouter aux contacts
      </button>
      <button class="btn-whatsapp" onclick="sendWhatsApp()">
        <span style="font-size:20px;">💬</span> إرسال عبر WhatsApp
      </button>
      <button class="btn-sms" onclick="sendSMS()">
        <span style="font-size:20px;">📱</span> إرسال عبر SMS
      </button>
    </div>
  </div>
</div>
<script src="auth.js"></script>
<script src="messages.js"></script>
<script src="detect-orders.js"></script>
<script src="parse-order.js"></script>
<script>
const sellerId = localStorage.getItem('sellerId'); // fixé à la connexion
document.getElementById('sellerId').value = sellerId;

let generatedLink = '';
let clientPhoneNumber = '';
let lastOrder = null;   // sert à construire le message

const phoneInput = document.getElementById('clientPhone');

const SCORE_COLORS = {
  trusted: '#22c55e',
  average: '#f59e0b',
  risky:   '#ef4444',
  few:     '#94a3b8',
  new:     '#94a3b8'
};

function resetScoreDisplay() {
  const num = document.getElementById('scoreNum');
  num.innerText = '--';
  num.style.color = SCORE_COLORS.new;
  document.getElementById('badgeText').innerText = '';
  document.getElementById('scoreCounts').innerText = '';
  document.getElementById('scoreHint').innerText = '';
}

function showScore(data) {
  const num = document.getElementById('scoreNum');
  // Pas de pourcentage tant qu'il n'y a pas assez d'historique (jamais "0%" par défaut)
  num.innerText = data.score === null || data.score === undefined ? '' : data.score + '%';
  num.style.color = SCORE_COLORS[data.status] || SCORE_COLORS.new;
  document.getElementById('badgeText').innerText = data.badge;

  document.getElementById('scoreCounts').innerText =
    data.total > 0 ? '📦 ' + data.ok + ' تم التسليم   ↩️ ' + data.ko + ' مرتجع' : '';

  const hint = document.getElementById('scoreHint');
  if (data.status === 'new') {
    hint.innerText = 'زبون جديد: لا توجد نتائج تسليم مسجّلة لهذا الرقم (هذا ليس مؤشراً سلبياً).';
  } else if (data.status === 'few') {
    hint.innerText = 'عدد التسليمات المسجّلة قليل: لا يكفي لحساب نسبة موثوقة بعد.';
  } else {
    hint.innerText = '';
  }
}

phoneInput.addEventListener('input', async () => {
  resetScoreDisplay();
  document.getElementById('phoneError').innerText = '';
  const phone = phoneInput.value.trim();
  if (phone.length < 10) return;

  try {
    const res = await fetch(`/score/client/${encodeURIComponent(phone)}`);
    const data = await res.json();
    if (phoneInput.value.trim() !== phone) return;
    if (!res.ok) {
      document.getElementById('phoneError').innerText = data.message || 'رقم الهاتف غير صالح';
      return;
    }
    showScore(data);
  } catch {
    if (phoneInput.value.trim() === phone) {
      document.getElementById('phoneError').innerText = 'تعذر التحقق من رقم الهاتف';
    }
  }
});

document.getElementById('orderForm').onsubmit = async (e) => {
  e.preventDefault();
  const formData = new FormData();
  formData.append('sellerId', sellerId);
  formData.append('clientName', document.getElementById('clientName').value);
  formData.append('clientPhone', phoneInput.value);
  formData.append('productRef', document.getElementById('productRef').value);
  formData.append('amount', document.getElementById('amount').value);
  formData.append('description', document.getElementById('description').value);
  const photo = document.getElementById('productPhoto').files[0];
  if (photo) formData.append('productPhoto', photo);

  let data;
  try {
    const res = await fetch('/create-confirmation', { method: 'POST', body: formData });
    data = await res.json();
  } catch {
    document.getElementById('phoneError').innerText = 'تعذر الاتصال بالخادم';
    return;
  }
  if (data.success) {
    generatedLink = data.clientLink;
    clientPhoneNumber = data.clientPhone;
    lastOrder = {
      name: document.getElementById('clientName').value,
      product: document.getElementById('productRef').value,
      price: document.getElementById('amount').value,
      link: data.clientLink
    };
    document.getElementById('msgLang').value = Messages.lang();
    Messages.refresh().then(renderMessage);
    renderMessage();
    document.getElementById('orderForm').style.display = 'none';
    document.getElementById('resultSection').style.display = 'block';
  } else {
    document.getElementById('phoneError').innerText = data.message || 'تعذر إنشاء رابط التأكيد';
  }
};

function addContact() {
  const name = document.getElementById('clientName').value;
  const phone = phoneInput.value.trim();
  const vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:${name}\nTEL;TYPE=CELL:${phone}\nEND:VCARD`;
  const blob = new Blob([vcard], { type: 'text/vcard' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${name}.vcf`;
  a.click();
  URL.revokeObjectURL(url);
}

/* remplir le formulaire depuis un message copié (Facebook, Messenger, WhatsApp...) */
const FIELD_LABELS = { phone: 'الهاتف', name: 'الاسم', product: 'المنتج', price: 'السعر' };

function fillFromText() {
  const text = document.getElementById('pasteText').value;
  const out = document.getElementById('fillResult');
  if (!text.trim()) { out.textContent = ''; return; }

  const r = ParseOrder.parseOrderText(text);
  const set = (id, value) => { document.getElementById(id).value = value; };

  if (r.found.phone) {
    set('clientPhone', r.phone);
    document.getElementById('clientPhone').dispatchEvent(new Event('input'));   // affiche la note du client
  }
  if (r.found.name) set('clientName', r.name);
  if (r.found.product) set('productRef', r.product);
  if (r.found.price) set('amount', String(r.price));
  if (r.found.description) set('description', r.description);

  const required = ['phone', 'name', 'product', 'price'];
  const ok = required.filter(k => r.found[k]).map(k => FIELD_LABELS[k]);
  const miss = required.filter(k => !r.found[k]).map(k => FIELD_LABELS[k]);

  let html = '';
  if (ok.length) html += '<div class="fill-ok">✅ تم التعرف على: ' + ok.join('، ') + '</div>';
  if (miss.length) html += '<div class="fill-miss">✍️ أكمل يدوياً: ' + miss.join('، ') + '</div>';
  if (!ok.length) html = '<div class="fill-miss">لم أجد معلومات واضحة في هذه الرسالة، أدخلها يدوياً.</div>';
  out.innerHTML = html;
}

document.getElementById('fillBtn').addEventListener('click', fillFromText);
// Après un collage, on remplit tout de suite
document.getElementById('pasteText').addEventListener('paste', () => setTimeout(fillFromText, 50));

function renderMessage() {
  if (lastOrder) document.getElementById('msgPreview').value = Messages.confirm(lastOrder);
}

document.getElementById('msgLang').addEventListener('change', (e) => {
  Messages.setLang(e.target.value);
  renderMessage();   // remplace le texte affiché par la version dans la langue choisie
});

function sendWhatsApp() {
  const text = document.getElementById('msgPreview').value.trim() || Messages.confirm(lastOrder);
  window.open(`https://wa.me/${clientPhoneNumber}?text=${encodeURIComponent(text)}`, '_blank');
}

function sendSMS() {
  window.location.href = `sms:+${clientPhoneNumber}?body=${encodeURIComponent(Messages.confirmSms(lastOrder))}`;
}
</script>
</body>
</html>
